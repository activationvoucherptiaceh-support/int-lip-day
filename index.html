<!DOCTYPE html>
<html lang="id" class="overflow-x-hidden">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>COMPLETE YOUR QUEST</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <!-- Tambahkan Tailwind CDN untuk mengambil styling desain referensi -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Tambahkan library canvas-confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="min-h-screen relative overflow-x-hidden overflow-y-auto" style="background: linear-gradient(160deg, #fff5f9 0%, #fdf2f8 30%, #fce7f3 70%, #fad4e8 100%); font-family: 'Poppins', sans-serif;">
    <!-- Dekorasi Background -->
    <div class="absolute top-0 right-0 w-64 h-64 rounded-full pointer-events-none" style="background: radial-gradient(circle, rgba(251,207,232,0.6), transparent); transform: translate(30%, -30%);"></div>
    <div class="absolute top-40 left-0 w-48 h-48 rounded-full pointer-events-none" style="background: radial-gradient(circle, rgba(253,242,248,0.8), transparent); transform: translateX(-30%);"></div>
    
    <div class="relative max-w-sm mx-auto px-4 pt-8 pb-16" id="main-container">
        <!-- Header -->
        <div class="flex justify-between items-center mb-6">
            <div class="flex items-center gap-2">
                <div class="w-8 h-8 rounded-full bg-gradient-to-br from-pink-500 to-rose-600 flex items-center justify-center shadow-md">
                    <span class="text-white font-black text-xs tracking-tight">P</span>
                </div>
                <span class="font-bold text-base tracking-widest text-rose-700 uppercase">Paragon</span>
            </div>
            <div class="flex items-center gap-1 text-pink-300">✨ 💖 ⭐</div>
        </div>

        <!-- Hero -->
        <div class="text-center mb-8 relative">
            <div class="flex justify-center items-center gap-2 mb-1">
                <span class="text-yellow-400 sparkle-anim">⭐</span>
                <span id="storeBadge" class="text-xs font-bold uppercase tracking-widest text-pink-400 bg-pink-50 rounded-full px-3 py-1">STORE</span>
                <span class="text-yellow-400 sparkle-anim" style="animation-delay: 0.6s">⭐</span>
            </div>
            <h1 class="font-black text-4xl leading-none tracking-tight mt-3 mb-1">
                <span style="background: linear-gradient(135deg, #be185d, #ec4899, #f43f5e); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">CAR FREE DAY!!!</span>
            </h1>
            <h2 class="font-black text-xl text-gray-800 uppercase tracking-wider mt-3 mb-2">Complete the Mission!</h2>
            <p class="text-sm text-gray-500 leading-relaxed">Follow dan like konten di bawah dan unlock your special reward 💗</p>
        </div>

        <!-- Progress Section -->
        <div class="bg-white rounded-3xl p-5 shadow-lg border border-pink-100 mb-6">
            <div class="flex items-center justify-between mb-3">
                <span class="text-xs font-bold uppercase tracking-widest text-gray-400">Your Progress</span>
                <span id="progressBadge" class="text-xs font-bold px-2 py-0.5 rounded-full bg-pink-100 text-pink-600">0%</span>
            </div>
            <div class="flex items-end gap-2 mb-3">
                <span id="countDone" class="font-black text-3xl text-gray-800">0</span>
                <span id="countTotal" class="font-bold text-lg text-gray-400 mb-0.5">/ 0</span>
                <span class="text-xs font-semibold text-gray-400 uppercase tracking-wide mb-1 ml-1">Missions</span>
            </div>
            
            <div class="relative w-full h-4 bg-pink-100 rounded-full overflow-hidden shadow-inner">
                <div id="progressFill" class="h-full rounded-full transition-all duration-700 ease-out relative overflow-hidden w-0" style="background: linear-gradient(90deg, #f472b6, #ec4899, #be185d);">
                    <div class="absolute inset-0 opacity-40" style="background: linear-gradient(90deg, transparent, rgba(255,255,255,0.6), transparent); background-size: 200% 100%; animation: shimmer 1.5s linear infinite;"></div>
                </div>
            </div>
            
            <div class="mt-3 text-center">
                <p id="motivationalText" class="text-sm font-semibold text-gray-600">Let's get started! ✨</p>
            </div>
        </div>

        <!-- Missions List -->
        <div class="mb-6">
            <div class="flex items-center gap-2 mb-4">
                <span class="text-pink-400">✨</span>
                <h3 class="font-black text-sm uppercase tracking-widest text-gray-700">Missions</h3>
                <div class="flex-1 h-px bg-pink-100"></div>
            </div>
            <div id="contentList" class="space-y-3">
                <!-- Tombol misi akan muncul di sini (di-generate oleh script.js) -->
            </div>
        </div>

        <!-- Reward Card -->
        <div>
            <div class="flex items-center gap-2 mb-4">
                <span class="text-yellow-400">✨</span>
                <h3 class="font-black text-sm uppercase tracking-widest text-gray-700">Your Reward</h3>
                <div class="flex-1 h-px bg-pink-100"></div>
            </div>
            <div id="rewardCard" class="relative rounded-3xl p-6 overflow-hidden transition-all duration-700 opacity-80 shadow-md" style="background: linear-gradient(135deg, #f9fafb, #f3f4f6); border: 2px solid #e5e7eb;">
                <div class="relative text-center">
                    <div id="rewardIcon" class="text-4xl mb-2">🎁</div>
                    <h3 id="rewardTitle" class="font-black text-xl tracking-wider uppercase mb-1 text-gray-400">Reward Locked</h3>
                    <p id="rewardDesc" class="text-sm mb-5 text-gray-400">Complete all missions to unlock your reward.</p>
                    <button id="claimButton" disabled class="w-full py-4 rounded-2xl font-black text-sm tracking-widest uppercase transition-all duration-300 bg-gray-200 text-gray-400 cursor-not-allowed">
                        🔒 Locked
                    </button>
                </div>
            </div>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
